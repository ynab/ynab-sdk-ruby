name: Socket Full Application Reachability

on:
  push:
    # TEST ONLY (never merge): runs on this branch to exercise ynab-sast-scanner#8.
    branches: [main, test-socket-reachability-followups]
  # Socket replaces a full application result older than 7 days with the next GitHub App scan,
  # so re-run twice a week (Monday and Thursday) even when nothing has merged.
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:

jobs:
  socket-reachability:
    # Run from @main for the same reasons as socket-basics.yml: we control ynab-sast-scanner, and it pins its own dependencies.
    # TEST ONLY (never merge): points at ynab-sast-scanner#8's branch instead of main.
    uses: ynab/ynab-sast-scanner/.github/workflows/socket-reachability.yml@fix-socket-reachability-followups
    with:
      ruby-version: "3.4.8"
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
